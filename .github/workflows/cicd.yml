name: Build and Deploy Docker Image

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  ECS_CLUSTER: nginx-cluster
  ECS_SERVICE: nginx-task-service-nokaoksl

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Image Tag Variables
        id: prep
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          REPOSITORY="${{ vars.ECR_REPOSITORY }}"
          
          echo "IMAGE_SHA=$REGISTRY/$REPOSITORY:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "IMAGE_LATEST=$REGISTRY/$REPOSITORY:latest" >> $GITHUB_OUTPUT

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ steps.prep.outputs.IMAGE_SHA }} \
            -t ${{ steps.prep.outputs.IMAGE_LATEST }} .

      - name: Push Docker Images to ECR
        run: |
          docker push ${{ steps.prep.outputs.IMAGE_SHA }}
          docker push ${{ steps.prep.outputs.IMAGE_LATEST }}

      - name: Update ECS Service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment